name: Supper-Mind AI SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:

  quality-and-test:
    name: Code Quality & Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Code Style & Syntax Audit (ESLint)
        run: npm run lint

      - name: Unit & Component Tests (Vitest)
        run: npm run test

      - name: Production Bundle Verification (Vite)
        run: npm run build


  security-audit:
    name: Container & Filesystem Vulnerability Audit
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
