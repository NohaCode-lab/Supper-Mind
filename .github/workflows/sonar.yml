name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  sonar-analysis:
    name: Supper-Mind SonarCloud Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Supper-Mind
            -Dsonar.organization=nohacode-lab
            -Dsonar.sources=src
